<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Invertir cadena</title>
  <style>
    /* CSS simple */
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding: 32px; background: #f7f7f8; color: #111; }
    .card { max-width: 520px; margin: 0 auto; background: #fff; padding: 18px; border-radius: 8px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
    label { display:block; font-size:14px; margin-bottom:6px; }
    input[type="text"] { width:100%; padding:10px 12px; font-size:16px; border:1px solid #ddd; border-radius:6px; box-sizing:border-box; }
    button { margin-top:10px; padding:10px 14px; font-size:15px; border:0; border-radius:6px; background:#0366d6; color:#fff; cursor:pointer; }
    button:active{ transform:translateY(1px) }
    .hint { margin-top:12px; color:#555; font-size:13px; }
    .result { margin-top:14px; padding:10px 12px; background:#f0f4ff; border-radius:6px; font-weight:600; word-break:break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Invertir cadena</h2>

    <label for="inputText">Escribe aquí</label>
    <input id="inputText" type="text" placeholder="Ej: AI4Devs" />

   <button id="reverseBtn" type="button" hidden>Invertir</button>

    <div class="hint">Por ejemplo: invierte el nombre</div>

    <div id="output" class="result" aria-live="polite"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
